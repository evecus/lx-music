name: get lx music sources

on:
  schedule:
    # 每天 UTC 02:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. 获取上游最新 Release 信息 ──────────────────────────────────
      - name: Get latest release info
        id: release
        run: |
          RELEASE_JSON=$(curl -fsSL \
            "https://api.github.com/repos/guoyue2010/lxmusic-/releases/latest")

          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          ZIP_URL=$(echo "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' \
            | head -1)

          # 如果没有 asset，fallback 到 source zip
          if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
            ZIP_URL="https://github.com/guoyue2010/lxmusic-/archive/refs/tags/${TAG}.zip"
          fi

          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "zip_url=$ZIP_URL" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $TAG"
          echo "ZIP URL   : $ZIP_URL"

      # ── 2. 检出本仓库（含完整历史，用于读写 last_tag 文件）────────────
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── 3. 读取上次成功的 tag，与最新 tag 比较 ──────────────────────
      - name: Compare tags
        id: compare
        run: |
          NEW_TAG="${{ steps.release.outputs.tag }}"

          # 尝试从默认分支的 .last_synced_tag 文件读取上次 tag
          LAST_TAG=""
          if [ -f ".last_synced_tag" ]; then
            LAST_TAG=$(cat .last_synced_tag | tr -d '[:space:]')
          fi

          echo "Last synced tag : ${LAST_TAG:-<none>}"
          echo "Latest upstream : $NEW_TAG"

          # 用 sort -V（版本号排序）判断 NEW_TAG 是否严格大于 LAST_TAG
          if [ -z "$LAST_TAG" ]; then
            # 从未同步过，直接执行
            SHOULD_RUN=true
          else
            HIGHER=$(printf '%s\n%s\n' "$LAST_TAG" "$NEW_TAG" \
              | sort -V | tail -1)
            if [ "$HIGHER" = "$NEW_TAG" ] && [ "$NEW_TAG" != "$LAST_TAG" ]; then
              SHOULD_RUN=true
            else
              SHOULD_RUN=false
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Should run: $SHOULD_RUN"

      - name: Skip if tag not updated
        if: steps.compare.outputs.should_run == 'false'
        run: |
          echo "✅ 上游 tag 未更新（${{ steps.release.outputs.tag }}），无需同步，退出。"
          exit 0

      # ── 4. 切换到 sources 分支（不存在则创建）───────────────────────
      - name: Checkout or create sources branch
        if: steps.compare.outputs.should_run == 'true'
        run: |
          if git ls-remote --exit-code --heads origin sources; then
            git checkout sources
          else
            git checkout --orphan sources
            git rm -rf . || true
            git commit --allow-empty -m "init sources branch"
            git push origin sources
          fi

      # ── 5. 下载并解压上游 zip ─────────────────────────────────────────
      - name: Download upstream release zip
        if: steps.compare.outputs.should_run == 'true'
        run: |
          curl -fsSL "${{ steps.release.outputs.zip_url }}" -o /tmp/lxmusic.zip

      - name: Extract 推荐 folder from zip
        if: steps.compare.outputs.should_run == 'true'
        run: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8

          mkdir -p /tmp/lxmusic_extracted
          unzip -O UTF-8 -o /tmp/lxmusic.zip -d /tmp/lxmusic_extracted

          echo "=== 解压后的目录结构 ==="
          find /tmp/lxmusic_extracted -type d

          # 取 zip 内的顶层版本目录（如 V260817）
          TOP_DIR=$(ls /tmp/lxmusic_extracted/ | head -1)
          echo "Top dir: $TOP_DIR"

          # 列出顶层目录下的所有子目录，找包含"推荐"的那个
          RECOMMEND_DIR=""
          while IFS= read -r -d '' dir; do
            dirname=$(basename "$dir")
            echo "Checking dir: $dirname"
            if echo "$dirname" | grep -q "推荐"; then
              RECOMMEND_DIR="$dir"
              break
            fi
          done < <(find "/tmp/lxmusic_extracted/$TOP_DIR" -maxdepth 1 -mindepth 1 -type d -print0)

          if [ -z "$RECOMMEND_DIR" ]; then
            echo "❌ 未找到「推荐」文件夹，退出"
            echo "现有子目录："
            ls -la "/tmp/lxmusic_extracted/$TOP_DIR/"
            exit 1
          fi

          echo "Found 推荐 dir: $RECOMMEND_DIR"
          echo "RECOMMEND_DIR=$RECOMMEND_DIR" >> "$GITHUB_ENV"

      # ── 6. 清空 sources 分支上的旧文件 ───────────────────────────────
      - name: Clear old files on sources branch
        if: steps.compare.outputs.should_run == 'true'
        run: |
          git rm -rf . || true
          find . -not -path './.git/*' -not -name '.git' \
            -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true

      # ── 7. 复制新 js 文件到仓库根目录 ────────────────────────────────
      - name: Copy JS files from 推荐 folder
        if: steps.compare.outputs.should_run == 'true'
        run: |
          cp "$RECOMMEND_DIR"/*.js . 2>/dev/null || {
            echo "❌ 推荐文件夹内没有 .js 文件"
            exit 1
          }
          echo "Copied files:"
          ls -1 *.js

      # ── 8. 生成 sources.json ──────────────────────────────────────────
      - name: Generate sources.json
        if: steps.compare.outputs.should_run == 'true'
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BASE_URL="https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@sources"

          SOURCES_JSON=""
          for f in *.js; do
            ENCODED=$(python3 -c "
          import urllib.parse, sys
          print(urllib.parse.quote(sys.argv[1], safe=''))
          " "$f")
            SOURCES_JSON="${SOURCES_JSON}    { \"url\": \"${BASE_URL}/${ENCODED}\" },\n"
          done
          SOURCES_JSON="${SOURCES_JSON%,\\n}"

          cat > sources.json <<EOF
          {
            "version": "${TAG}",
            "name": "优质聚合源",
            "sources": [
          $(echo -e "$SOURCES_JSON" | sed 's/^  //')
            ]
          }
          EOF

          echo "Generated sources.json:"
          cat sources.json

      # ── 9. 提交并推送到 sources 分支 ─────────────────────────────────
      - name: Commit and push to sources branch
        if: steps.compare.outputs.should_run == 'true'
        run: |
          git add -A
          TAG="${{ steps.release.outputs.tag }}"

          if git diff --cached --quiet; then
            echo "✅ 内容无变化，无需提交"
          else
            git commit -m "chore: sync lxmusic sources ${TAG}"
            git push origin sources
            echo "✅ 已推送到 sources 分支"
          fi

      # ── 10. 回到默认分支，更新 .last_synced_tag ──────────────────────
      - name: Update last synced tag on default branch
        if: steps.compare.outputs.should_run == 'true'
        run: |
          TAG="${{ steps.release.outputs.tag }}"

          # 切回默认分支
          git checkout -

          echo "$TAG" > .last_synced_tag
          git add .last_synced_tag
          git commit -m "chore: update last synced tag to ${TAG}"
          git push origin HEAD
          echo "✅ .last_synced_tag 已更新为 ${TAG}"
