name: Sync LX Music Sources

on:
  schedule:
    # 每天 UTC 02:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. 获取上游最新 Release 信息 ──────────────────────────────────
      - name: Get latest release info
        id: release
        run: |
          RELEASE_JSON=$(curl -fsSL \
            "https://api.github.com/repos/guoyue2010/lxmusic-/releases/latest")

          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          ZIP_URL=$(echo "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' \
            | head -1)

          # 如果没有 asset，fallback 到 source zip
          if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
            ZIP_URL="https://github.com/guoyue2010/lxmusic-/archive/refs/tags/${TAG}.zip"
          fi

          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "zip_url=$ZIP_URL" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $TAG"
          echo "ZIP URL   : $ZIP_URL"

      # ── 2. 检出本仓库的 release 分支（不存在则自动创建空分支）──────────
      - name: Checkout default branch first
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout or create release branch
        run: |
          if git ls-remote --exit-code --heads origin release; then
            git checkout release
          else
            git checkout --orphan release
            git rm -rf . || true
            git commit --allow-empty -m "init release branch"
            git push origin release
          fi

      # ── 3. 下载并解压上游 zip ─────────────────────────────────────────
      - name: Download upstream release zip
        run: |
          curl -fsSL "${{ steps.release.outputs.zip_url }}" -o /tmp/lxmusic.zip

      - name: Extract 推荐 folder from zip
        run: |
          mkdir -p /tmp/lxmusic_extracted
          unzip -o /tmp/lxmusic.zip -d /tmp/lxmusic_extracted

          # 找到"推荐"文件夹（zip 内层目录名可能带版本前缀）
          RECOMMEND_DIR=$(find /tmp/lxmusic_extracted -maxdepth 2 \
            -type d -name "推荐" | head -1)

          if [ -z "$RECOMMEND_DIR" ]; then
            echo "❌ 未找到「推荐」文件夹，退出"
            exit 1
          fi

          echo "Found 推荐 dir: $RECOMMEND_DIR"
          echo "RECOMMEND_DIR=$RECOMMEND_DIR" >> "$GITHUB_ENV"

      # ── 4. 清空 release 分支上的旧文件 ───────────────────────────────
      - name: Clear old files on release branch
        run: |
          git rm -rf . || true   # 删除所有被 git 跟踪的文件
          # 清理未跟踪文件（保留 .git 目录）
          find . -not -path './.git/*' -not -name '.git' \
            -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true

      # ── 5. 复制新 js 文件到仓库根目录 ────────────────────────────────
      - name: Copy JS files from 推荐 folder
        run: |
          cp "$RECOMMEND_DIR"/*.js . 2>/dev/null || {
            echo "❌ 推荐文件夹内没有 .js 文件"
            exit 1
          }
          echo "Copied files:"
          ls -1 *.js

      # ── 6. 生成 sources.json ──────────────────────────────────────────
      - name: Generate sources.json
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BASE_URL="https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@release"

          # 收集所有 js 文件名，生成 sources 数组
          SOURCES_JSON=""
          for f in *.js; do
            ENCODED=$(python3 -c "
          import urllib.parse, sys
          print(urllib.parse.quote(sys.argv[1], safe=''))
          " "$f")
            SOURCES_JSON="${SOURCES_JSON}    { \"url\": \"${BASE_URL}/${ENCODED}\" },\n"
          done
          # 去掉末尾多余的逗号
          SOURCES_JSON="${SOURCES_JSON%,\\n}"

          cat > sources.json <<EOF
          {
            "version": "${TAG}",
            "sources": [
          $(echo -e "$SOURCES_JSON" | sed 's/^  //')
            ]
          }
          EOF

          echo "Generated sources.json:"
          cat sources.json

      # ── 7. 提交并推送到 release 分支 ─────────────────────────────────
      - name: Commit and push
        run: |
          git add -A
          git status

          TAG="${{ steps.release.outputs.tag }}"

          # 如果没有变化则跳过提交
          if git diff --cached --quiet; then
            echo "✅ 内容无变化，无需提交"
          else
            git commit -m "chore: sync lxmusic sources ${TAG}"
            git push origin release
            echo "✅ 已推送到 release 分支"
          fi
